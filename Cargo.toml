[workspace]
resolver = "3"
members = ["crates/amt", "crates/amt-mcp", "crates/amt-fake"]

[workspace.package]
version = "0.1.0" # x-release-please-version
edition = "2024"
license = "MIT"
repository = "https://github.com/eljefedelrodeodeljefe/amt-mcp"

[workspace.dependencies]
amt = { path = "crates/amt", version = "0.1.0" } # x-release-please-version
amt-fake = { path = "crates/amt-fake" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
